<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Bookstore Chain Network</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Login Page -->
    <main class="login_page">

        <!-- Login Card -->
        <section class="login_card">

            <!-- Logo -->
            <div class="logo">
                📖
            </div>

            <!-- Title -->
            <div class="title">
                <h1>Smart Bookstore Chain Network</h1>
                <p>Connected Bookstores. Smarter Management.</p>
            </div>

            <!-- Login Form -->
            <form class="login_form">

                <!-- Username / Email -->
                <div class="form_group">
                    <label for="username">Username / Email</label>

                    <input type="text" id="username" name="username" placeholder="Enter user name or email id">
                </div>

                <!-- Password -->
                <div class="form_group">
                    <label for="password">Password</label>

                    <div class="password_field">
                        <input type="password" id="password" name="password" placeholder="Enter password">

                        <button type="button" class="show_password">
                            👁
                        </button>
                    </div>
                </div>

                <!-- Login Button -->
                <button type="submit" class="login_button">
                    Login to Dashboard
                </button>

            </form>

            <!-- Footer Information -->
            <footer class="login_footer">
                CMCA0302 · Computer Networking · MCA 3rd Sem · 2025–2027
            </footer>

        </section>
    </main>
</body>

</html>
